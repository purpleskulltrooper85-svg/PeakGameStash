<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Game Stash</title>

  <style>
    @font-face {
      font-family: PeakPixel;
      src: url("https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/PeakGameStash@main/themes/undertale/PixelOperatorMono-Bold.ttf?v=7")
        format("truetype");
    }

    :root {
      --bg1: #08051e;
      --bg2: #1a0c49;
      --bg3: #36136b;
      --text: #ffffff;
      --muted: #c4bde7;
      --card: rgba(15, 12, 47, 0.78);
      --card-hover: rgba(49, 29, 112, 0.92);
      --line: rgba(197, 181, 255, 0.30);
      --accent: #bd9cff;
      --accent2: #5edaff;
      --button-text: #160a32;
      --main-font: Arial, sans-serif;
      --title-font: Arial, sans-serif;
      --sbr-bg: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: var(--main-font);
      background:
        radial-gradient(circle at 15% 18%, rgba(129, 85, 255, .28), transparent 27%),
        radial-gradient(circle at 85% 20%, rgba(62, 206, 255, .20), transparent 24%),
        radial-gradient(circle at 52% 85%, rgba(236, 72, 255, .16), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 150% 150%;
      background-attachment: fixed;
      animation: galaxy 18s ease-in-out infinite alternate;
    }

    @keyframes galaxy {
      from {
        background-position: 0% 35%;
      }

      to {
        background-position: 100% 65%;
      }
    }

    body.theme-undertale {
      --bg1: #000000;
      --bg2: #000000;
      --bg3: #000000;
      --text: #ffffff;
      --muted: #aaaaaa;
      --card: #000000;
      --card-hover: #101010;
      --line: #555555;
      --accent: #ffff00;
      --accent2: #ffff00;
      --button-text: #000000;
      --main-font: PeakPixel, "Courier New", monospace;
      --title-font: PeakPixel, "Courier New", monospace;
      background: #000000;
      animation: none;
    }

    body.theme-sbr {
      --text: #fff6d8;
      --muted: #e7c98b;
      --card: rgba(30, 14, 7, .82);
      --card-hover: rgba(86, 44, 12, .9);
      --line: rgba(255, 207, 97, .5);
      --accent: #ffd35b;
      --accent2: #da6a20;
      --button-text: #281102;
      --main-font: Georgia, serif;
      --title-font: Georgia, serif;
      background-color: #1a0903;
      background-image:
        linear-gradient(rgba(18, 6, 2, .56), rgba(18, 6, 2, .72)),
        var(--sbr-bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      animation: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .shell {
      width: min(1400px, calc(100% - 40px));
      margin: auto;
      padding: 28px 0 70px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border: 2px solid var(--accent);
      border-radius: 16px;
      background: #000;
    }

    .logo h1 {
      margin: 0;
      font-family: var(--title-font);
      font-size: clamp(22px, 3vw, 39px);
    }

    .logo p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .theme-area {
      position: relative;
    }

    #theme-button {
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    #theme-button:hover {
      border-color: var(--accent);
    }

    #theme-list {
      position: absolute;
      top: 58px;
      right: 0;
      z-index: 20;
      width: 270px;
      display: none;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #15102f;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .5);
    }

    body.theme-undertale #theme-list {
      border-radius: 0;
      background: #000;
    }

    body.theme-sbr #theme-list {
      background: #2d1004;
    }

    #theme-list.open {
      display: block;
    }

    .theme-choice {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .theme-choice:hover {
      background: rgba(255, 255, 255, .1);
    }

    .theme-choice.disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .hero {
      max-width: 900px;
      margin: 65px auto 35px;
      text-align: center;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(35px, 5vw, 65px);
    }

    .hero h2 span {
      color: var(--accent);
    }

    .hero p {
      margin: 14px 0 25px;
      color: var(--muted);
      font-size: 19px;
    }

    #search {
      width: 100%;
      height: 62px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 20px;
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(185, 156, 255, .16);
    }

    .games-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 40px 0 18px;
    }

    .games-title h3 {
      margin: 0;
      font-size: 35px;
    }

    #count {
      color: var(--muted);
    }

    #games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      transition: transform .18s ease, border-color .18s ease;
    }

    body.theme-undertale .card {
      border-radius: 0;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-6px);
    }

    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: linear-gradient(135deg, #322165, #15102f);
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: var(--title-font);
      font-size: 20px;
      text-align: center;
    }

    .card-content {
      padding: 17px;
    }

    .card-content h4 {
      margin: 0;
      overflow: hidden;
      font-size: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play {
      width: 100%;
      min-height: 43px;
      margin-top: 15px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--button-text);
      cursor: pointer;
      font-weight: bold;
      font-size: 17px;
    }

    body.theme-undertale .play {
      border-radius: 0;
      background: #ffff00;
    }

    .play:hover {
      filter: brightness(1.15);
    }

    #player {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #000;
    }

    #player.open {
      display: block;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #back {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 5;
      display: none;
      padding: 9px 13px;
      border: 2px solid #fff;
      background: #000;
      color: #fff;
      cursor: pointer;
      font-family: PeakPixel, "Courier New", monospace;
      font-size: 17px;
    }

    #back:hover {
      border-color: #ffff00;
      color: #ffff00;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: #000;
      pointer-events: none;
    }

    #loading-border {
      width: min(500px, 75vw);
      height: 32px;
      padding: 4px;
      border: 4px solid #fff;
    }

    #loading-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width .15s linear;
    }

    @media (max-width: 650px) {
      .shell {
        width: calc(100% - 24px);
        padding-top: 15px;
      }

      .logo img {
        width: 46px;
        height: 46px;
      }

      .logo p {
        display: none;
      }

      .hero {
        margin-top: 45px;
      }

      #games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .card-content {
        padding: 12px;
      }

      .card-content h4 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header>
      <div class="logo">
        <img
          src="https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/PeakGameStash@main/icon.png?v=7"
          alt="Peak Game Stash icon"
        >

        <div>
          <h1>Peak Game Stash</h1>
          <p>Your personal browser-game collection.</p>
        </div>
      </div>

      <div class="theme-area">
        <button id="theme-button" type="button">✦ Themes ▾</button>

        <div id="theme-list">
          <button class="theme-choice" data-theme="galaxy" type="button">
            ✦ Galaxy
          </button>

          <button class="theme-choice" data-theme="undertale" type="button">
            ♥ Undertale &amp; Deltarune
          </button>

          <button class="theme-choice" data-theme="sbr" type="button">
            ★ Steel Ball Run
          </button>

          <button class="theme-choice disabled" type="button" disabled>
            ◇ Coming Soon
          </button>
        </div>
      </div>
    </header>

    <section class="hero">
      <h2>Find your next <span>peak</span> game.</h2>
      <p>Search your game collection and play directly in your browser.</p>

      <input
        id="search"
        type="search"
        placeholder="Search your game stash..."
        aria-label="Search games"
      >
    </section>

    <section>
      <div class="games-title">
        <h3>Games</h3>
        <span id="count">1 game</span>
      </div>

      <div id="games"></div>
    </section>
  </main>

  <section id="player">
    <button id="back" type="button">← BACK TO STASH</button>

    <div id="loading">
      <div id="loading-border">
        <div id="loading-fill"></div>
      </div>
    </div>

    <iframe
      id="game"
      title="Game Player"
      allow="autoplay; fullscreen; gamepad"
    ></iframe>
  </section>

  <script>
    const USER = "purpleskulltrooper85-svg";
    const REPO = "PeakGameStash";
    const BRANCH = "main";
    const VERSION = "7";

    const CDN = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}`;
    const PAGES = `https://${USER}.github.io/${REPO}`;

    const GAMES = [
      {
        title: "Deltarune",
        game: "games/dgDeltarune.html",
        image: "images/dgDeltarune.png"
      }
    ];

    const ASSETS = {
      regularClick: "themes/regular/ClickSound.mp3",
      regularMusic: "themes/regular/music.mp3",

      undertaleDrone: "themes/undertale/audio_drone.ogg",
      undertaleMove: "themes/undertale/snd_menumove.mp3",
      undertaleSelect: "themes/undertale/snd_select.mp3",
      undertaleMusic: "themes/undertale/music.ogg",

      sbrMusic: "themes/steelballrun/music.mp3",
      sbrBackground: "themes/steelballrun/background.png"
    };

    const gamesElement = document.getElementById("games");
    const countElement = document.getElementById("count");
    const searchElement = document.getElementById("search");
    const themeButton = document.getElementById("theme-button");
    const themeList = document.getElementById("theme-list");

    const player = document.getElementById("player");
    const gameFrame = document.getElementById("game");
    const backButton = document.getElementById("back");
    const loading = document.getElementById("loading");
    const loadingFill = document.getElementById("loading-fill");

    const clickSound = new Audio();
    const regularMusic = new Audio();
    const undertaleDrone = new Audio();
    const undertaleMove = new Audio();
    const undertaleSelect = new Audio();
    const undertaleMusic = new Audio();
    const sbrMusic = new Audio();

    let theme = localStorage.getItem("peak-theme") || "galaxy";
    let audioStarted = false;
    let loadingValue = 0;
    let loadingInterval = null;

    function cdn(path) {
      return `${CDN}/${path.split("/").map(encodeURIComponent).join("/")}?v=${VERSION}`;
    }

    function gameURL(path) {
      return `${PAGES}/${path.split("/").map(encodeURIComponent).join("/")}`;
    }

    function setupAudio() {
      clickSound.src = cdn(ASSETS.regularClick);
      regularMusic.src = cdn(ASSETS.regularMusic);

      undertaleDrone.src = cdn(ASSETS.undertaleDrone);
      undertaleMove.src = cdn(ASSETS.undertaleMove);
      undertaleSelect.src = cdn(ASSETS.undertaleSelect);
      undertaleMusic.src = cdn(ASSETS.undertaleMusic);

      sbrMusic.src = cdn(ASSETS.sbrMusic);

      clickSound.volume = 0.6;
      regularMusic.volume = 0.3;
      undertaleDrone.volume = 0.24;
      undertaleMove.volume = 0.52;
      undertaleSelect.volume = 0.62;
      undertaleMusic.volume = 0.3;
      sbrMusic.volume = 0.3;

      regularMusic.loop = true;
      undertaleDrone.loop = true;
      undertaleMusic.loop = true;
      sbrMusic.loop = true;
    }

    function play(sound) {
      sound.pause();
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function stopMusic() {
      regularMusic.pause();
      regularMusic.currentTime = 0;

      undertaleDrone.pause();
      undertaleDrone.currentTime = 0;

      undertaleMusic.pause();
      undertaleMusic.currentTime = 0;

      sbrMusic.pause();
      sbrMusic.currentTime = 0;
    }

    function startMusic() {
      if (!audioStarted || player.classList.contains("open")) return;

      stopMusic();

      if (theme === "galaxy") {
        regularMusic.play().catch(() => {});
      }

      if (theme === "undertale") {
        undertaleMusic.play().catch(() => {});
        undertaleDrone.play().catch(() => {});
      }

      if (theme === "sbr") {
        sbrMusic.play().catch(() => {});
      }
    }

    function unlockAudio() {
      if (audioStarted) return;

      audioStarted = true;
      startMusic();
    }

    function setTheme(nextTheme) {
      theme = nextTheme;

      document.body.classList.toggle("theme-undertale", theme === "undertale");
      document.body.classList.toggle("theme-sbr", theme === "sbr");

      if (theme === "sbr") {
        document.documentElement.style.setProperty(
          "--sbr-bg",
          `url("${cdn(ASSETS.sbrBackground)}")`
        );
      }

      if (theme === "undertale") {
        themeButton.textContent = "♥ Themes ▾";
      } else if (theme === "sbr") {
        themeButton.textContent = "★ Themes ▾";
      } else {
        themeButton.textContent = "✦ Themes ▾";
      }

      localStorage.setItem("peak-theme", theme);

      themeList.classList.remove("open");
      startMusic();
      renderGames();
    }

    function hoverSound() {
      if (theme === "undertale") {
        play(undertaleMove);
      }
    }

    function clickGameSound() {
      if (theme === "undertale") {
        play(undertaleSelect);
      }

      if (theme === "galaxy") {
        play(clickSound);
      }
    }

    function createCard(gameInfo) {
      const card = document.createElement("article");
      card.className = "card";

      const cover = document.createElement("div");
      cover.className = "cover";

      const fallback = document.createElement("div");
      fallback.className = "cover-fallback";
      fallback.textContent = gameInfo.title;

      const image = document.createElement("img");
      image.src = cdn(gameInfo.image);
      image.alt = `${gameInfo.title} cover`;

      image.addEventListener("load", () => {
        fallback.style.display = "none";
      });

      image.addEventListener("error", () => {
        image.remove();
      });

      cover.append(fallback, image);

      const content = document.createElement("div");
      content.className = "card-content";

      const title = document.createElement("h4");
      title.textContent = gameInfo.title;

      const playButton = document.createElement("button");
      playButton.className = "play";
      playButton.type = "button";
      playButton.textContent = "PLAY";

      playButton.addEventListener("click", () => {
        openGame(gameInfo);
      });

      card.addEventListener("mouseenter", hoverSound);
      playButton.addEventListener("mouseenter", hoverSound);

      content.append(title, playButton);
      card.append(cover, content);

      return card;
    }

    function renderGames() {
      const search = searchElement.value.toLowerCase().trim();

      const shownGames = GAMES.filter(gameInfo => {
        return gameInfo.title.toLowerCase().includes(search);
      });

      gamesElement.innerHTML = "";

      shownGames.forEach(gameInfo => {
        gamesElement.appendChild(createCard(gameInfo));
      });

      countElement.textContent =
        `${shownGames.length} game${shownGames.length === 1 ? "" : "s"}`;
    }

    function setLoading(value) {
      loadingValue = Math.max(0, Math.min(100, value));
      loadingFill.style.width = `${loadingValue}%`;
    }

    function beginLoading() {
      clearInterval(loadingInterval);
      setLoading(0);
      loading.style.display = "grid";

      loadingInterval = setInterval(() => {
        if (loadingValue < 88) {
          setLoading(loadingValue + (loadingValue < 45 ? 5 : 1.8));
        }
      }, 120);
    }

    function finishLoading() {
      clearInterval(loadingInterval);
      setLoading(100);

      setTimeout(() => {
        loading.style.display = "none";
      }, 180);
    }

    function openGame(gameInfo) {
      unlockAudio();
      clickGameSound();
      stopMusic();

      player.classList.add("open");
      backButton.style.display = "block";

      beginLoading();

      gameFrame.src = gameURL(gameInfo.game);
    }

    function closeGame() {
      if (theme === "undertale") {
        play(undertaleSelect);
      }

      gameFrame.src = "about:blank";
      player.classList.remove("open");
      backButton.style.display = "none";

      clearInterval(loadingInterval);
      loading.style.display = "grid";
      setLoading(0);

      startMusic();
    }

    themeButton.addEventListener("click", () => {
      unlockAudio();
      themeList.classList.toggle("open");
      hoverSound();
    });

    document.querySelectorAll(".theme-choice[data-theme]").forEach(button => {
      button.addEventListener("click", () => {
        unlockAudio();

        if (theme === "undertale") {
          play(undertaleSelect);
        }

        setTheme(button.dataset.theme);
      });

      button.addEventListener("mouseenter", hoverSound);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".theme-area")) {
        themeList.classList.remove("open");
      }
    });

    searchElement.addEventListener("input", renderGames);

    searchElement.addEventListener("focus", () => {
      unlockAudio();
      hoverSound();
    });

    document.addEventListener("pointerdown", unlockAudio, {
      once: true
    });

    document.addEventListener("keydown", event => {
      unlockAudio();

      if (player.classList.contains("open")) {
        if (event.key === "Escape") {
          closeGame();
        }

        return;
      }

      if (event.key === "/") {
        event.preventDefault();
        searchElement.focus();
      }

      if (event.key === "Escape") {
        themeList.classList.remove("open");
      }
    });

    gameFrame.addEventListener("load", finishLoading);
    backButton.addEventListener("click", closeGame);

    setupAudio();
    setTheme(theme);
    renderGames();
  </script>
</body>
</html>
