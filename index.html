<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peak Game Stash</title>

  <style>
    @font-face {
      font-family: "Peak Pixel";
      src: url("https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/PeakGameStash@main/themes/undertale/PixelOperatorMono-Bold.ttf")
        format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --bg-one: #0a0825;
      --bg-two: #1b0e49;
      --bg-three: #2c145c;
      --text: #f7f5ff;
      --muted: #b9b0df;
      --card: rgba(17, 14, 49, 0.68);
      --card-hover: rgba(50, 31, 111, 0.83);
      --line: rgba(190, 172, 255, 0.25);
      --accent: #b99cff;
      --accent-two: #65d6ff;
      --button-text: #12092e;
      --shadow: rgba(0, 0, 0, 0.42);
      --font-main: Arial, system-ui, sans-serif;
      --font-title: Arial, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #09061d;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: var(--font-main);
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 83, 255, 0.28), transparent 27%),
        radial-gradient(circle at 85% 18%, rgba(67, 204, 255, 0.20), transparent 24%),
        radial-gradient(circle at 50% 85%, rgba(218, 71, 255, 0.17), transparent 28%),
        linear-gradient(135deg, var(--bg-one), var(--bg-two), var(--bg-three));
      background-size: 150% 150%;
      animation: galaxy-shift 18s ease-in-out infinite alternate;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
    }

    body::before {
      opacity: 0.7;
      background-image:
        radial-gradient(circle at 7% 17%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 18% 76%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 31% 39%, #fff 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 45% 13%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 58% 71%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 73% 29%, #fff 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 89% 61%, #fff 0 1px, transparent 1.7px);
      background-size: 340px 280px;
      animation: stars-drift 26s linear infinite;
    }

    body::after {
      opacity: 0.18;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 80px,
          rgba(255, 255, 255, 0.1) 81px,
          transparent 82px
        );
      mix-blend-mode: screen;
    }

    @keyframes galaxy-shift {
      from {
        background-position: 0% 35%;
      }

      to {
        background-position: 100% 65%;
      }
    }

    @keyframes stars-drift {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-70px, 45px, 0);
      }
    }

    body.theme-undertale {
      --bg-one: #000;
      --bg-two: #000;
      --bg-three: #000;
      --text: #fff;
      --muted: #aaa;
      --card: #000;
      --card-hover: #101010;
      --line: #3a3a3a;
      --accent: #ffff00;
      --accent-two: #ffff00;
      --button-text: #000;
      --shadow: #000;
      --font-main: "Peak Pixel", "Courier New", monospace;
      --font-title: "Peak Pixel", "Courier New", monospace;
      background: #000;
      animation: none;
      image-rendering: pixelated;
    }

    body.theme-undertale::before,
    body.theme-undertale::after {
      display: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .site-shell {
      width: min(1500px, calc(100% - 44px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 2px solid var(--accent);
      border-radius: 17px;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.18);
      font-size: 28px;
      box-shadow: 0 0 24px rgba(140, 109, 255, 0.25);
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-family: var(--font-title);
      font-size: clamp(22px, 2.7vw, 40px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 17px;
      letter-spacing: 0.4px;
    }

    .theme-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    #theme-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(10, 7, 32, 0.45);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 12px 25px var(--shadow);
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    #theme-button:hover,
    #theme-button:focus-visible {
      border-color: var(--accent);
      background: var(--card-hover);
      outline: none;
      transform: translateY(-2px);
    }

    .theme-icon {
      font-size: 22px;
      line-height: 1;
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      width: min(315px, calc(100vw - 30px));
      display: none;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(12, 8, 35, 0.96);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
    }

    body.theme-undertale .theme-menu {
      border-radius: 0;
      background: #000;
      backdrop-filter: none;
    }

    .theme-menu.open {
      display: block;
      animation: theme-open 170ms ease-out;
    }

    @keyframes theme-open {
      from {
        opacity: 0;
        transform: translateY(-7px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .theme-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 150ms ease;
    }

    body.theme-undertale .theme-option {
      border-radius: 0;
    }

    .theme-option:hover,
    .theme-option:focus-visible {
      background: rgba(185, 156, 255, 0.18);
      outline: none;
    }

    body.theme-undertale .theme-option:hover,
    body.theme-undertale .theme-option:focus-visible {
      background: #191919;
      color: var(--yellow);
    }

    .theme-option.disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .theme-option.disabled:hover {
      background: transparent;
    }

    .theme-preview {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;
    }

    .theme-preview.galaxy {
      background: linear-gradient(135deg, #0f0b36, #743ca3, #48c9f5);
    }

    .theme-preview.undertale {
      border-color: #fff;
      background: #000;
      box-shadow: inset 0 0 0 3px #ffff00;
    }

    .theme-preview.sbr {
      background: linear-gradient(135deg, #6d3918, #d2a22e, #234019);
    }

    .theme-preview.future {
      background:
        repeating-linear-gradient(
          45deg,
          #333 0 8px,
          #111 8px 16px
        );
    }

    .theme-option strong {
      display: block;
      font-size: 17px;
    }

    .theme-option small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .hero {
      max-width: 920px;
      margin: 0 auto 38px;
      text-align: center;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(30px, 5vw, 62px);
      line-height: 1.05;
      letter-spacing: -1.5px;
      text-wrap: balance;
    }

    .hero h2 span {
      color: var(--accent);
      text-shadow: 0 0 23px rgba(185, 156, 255, 0.55);
    }

    .hero p {
      max-width: 620px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.45;
    }

    .search-area {
      max-width: 900px;
      margin: 28px auto 0;
      position: relative;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 21px;
      color: var(--muted);
      font-size: 22px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    #search-input {
      width: 100%;
      height: 64px;
      padding: 0 20px 0 58px;
      border: 1px solid var(--line);
      border-radius: 18px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 20px;
      box-shadow: 0 15px 36px var(--shadow);
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    #search-input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    #search-input:focus {
      border-color: var(--accent);
      background: var(--card-hover);
      box-shadow: 0 0 0 4px rgba(185, 156, 255, 0.16), 0 15px 36px var(--shadow);
    }

    body.theme-undertale #search-input,
    body.theme-undertale #theme-button {
      border-radius: 0;
    }

    body.theme-undertale #search-input:focus {
      box-shadow: 0 0 0 3px #ffff00;
    }

    .games-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 48px 0 20px;
    }

    .games-heading h3 {
      margin: 0;
      font-size: clamp(25px, 3vw, 38px);
    }

    #game-count {
      color: var(--muted);
      font-size: 17px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 22px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--card);
      box-shadow: 0 16px 36px var(--shadow);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    body.theme-undertale .game-card {
      border-radius: 0;
      box-shadow: none;
    }

    .game-card:hover {
      border-color: var(--accent);
      background: var(--card-hover);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.5);
      transform: translateY(-7px);
    }

    .game-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(185, 156, 255, 0.28), rgba(50, 203, 255, 0.2)),
        #15102f;
    }

    .game-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .game-card:hover .game-image {
      transform: scale(1.06);
    }

    body.theme-undertale .game-image {
      image-rendering: pixelated;
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.2), transparent 32%),
        linear-gradient(135deg, #302164, #15102f);
      font-family: var(--font-title);
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }

    body.theme-undertale .image-fallback {
      color: #ffff00;
      background: #000;
      border: 3px solid #fff;
    }

    .game-info {
      padding: 17px;
    }

    .game-title {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 23px;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-id {
      min-height: 22px;
      margin: 7px 0 16px;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play-button {
      width: 100%;
      min-height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-two));
      color: var(--button-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.6px;
      transition: transform 130ms ease, filter 130ms ease;
    }

    body.theme-undertale .play-button {
      border-radius: 0;
      background: #ffff00;
      color: #000;
      font-family: "Peak Pixel", "Courier New", monospace;
    }

    .play-button:hover,
    .play-button:focus-visible {
      outline: none;
      filter: brightness(1.15);
      transform: scale(1.025);
    }

    .play-button:active {
      transform: scale(.98);
    }

    .state-box {
      grid-column: 1 / -1;
      padding: 48px 22px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      background: rgba(0, 0, 0, 0.16);
    }

    body.theme-undertale .state-box {
      border-radius: 0;
      background: #000;
    }

    .state-box strong {
      display: block;
      margin-bottom: 9px;
      color: var(--text);
      font-size: 24px;
    }

    .state-box code {
      color: var(--accent);
      font-family: "Courier New", monospace;
    }

    .site-footer {
      margin-top: 52px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    .site-footer span {
      color: var(--accent);
    }

    @media (max-width: 680px) {
      .site-shell {
        width: min(100% - 24px, 1500px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        margin-bottom: 32px;
      }

      .brand {
        gap: 10px;
      }

      .brand-mark {
        width: 45px;
        height: 45px;
        border-radius: 14px;
        font-size: 23px;
      }

      .brand p {
        display: none;
      }

      #theme-button {
        min-height: 43px;
        padding: 9px 12px;
      }

      .theme-button-label {
        display: none;
      }

      .hero {
        margin-bottom: 27px;
      }

      .games-heading {
        margin-top: 34px;
      }

      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .game-info {
        padding: 12px;
      }

      .game-title {
        font-size: 18px;
      }

      .game-id {
        margin: 5px 0 11px;
        font-size: 12px;
      }

      .play-button {
        min-height: 37px;
        font-size: 14px;
      }
    }

    @media (max-width: 390px) {
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="site-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">▲</div>

        <div>
          <h1>Peak Game Stash</h1>
          <p>Your personal browser-game collection.</p>
        </div>
      </div>

      <div class="theme-wrap">
        <button id="theme-button" type="button" aria-expanded="false">
          <span class="theme-icon" aria-hidden="true">✦</span>
          <span class="theme-button-label">Themes</span>
          <span aria-hidden="true">▾</span>
        </button>

        <div id="theme-menu" class="theme-menu" role="menu">
          <button class="theme-option" type="button" data-theme="galaxy">
            <span class="theme-preview galaxy"></span>
            <span>
              <strong>Galaxy</strong>
              <small>Animated cosmic gradient</small>
            </span>
          </button>

          <button class="theme-option" type="button" data-theme="undertale">
            <span class="theme-preview undertale"></span>
            <span>
              <strong>Undertale &amp; Deltarune</strong>
              <small>Black pixel-style theme</small>
            </span>
          </button>

          <button class="theme-option disabled" type="button" disabled>
            <span class="theme-preview sbr"></span>
            <span>
              <strong>Steel Ball Run</strong>
              <small>Coming later</small>
            </span>
          </button>

          <button class="theme-option disabled" type="button" disabled>
            <span class="theme-preview future"></span>
            <span>
              <strong>Theme Slot</strong>
              <small>Coming later</small>
            </span>
          </button>
        </div>
      </div>
    </header>

    <section class="hero">
      <h2>Find your next <span>peak</span> game.</h2>

      <p>
        Search your game collection and play directly in your browser.
      </p>

      <div class="search-area">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="search-input"
          type="search"
          autocomplete="off"
          placeholder="Search your game stash..."
          aria-label="Search games"
        />
      </div>
    </section>

    <section>
      <div class="games-heading">
        <h3>Games</h3>
        <span id="game-count">Loading games...</span>
      </div>

      <div id="games-grid" class="games-grid">
        <div class="state-box">
          <strong>Loading game stash...</strong>
          Reading your <code>/games</code> folder.
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>Peak Game Stash</span> · Powered by your GitHub repository
    </footer>
  </main>

  <script>
    const GITHUB_USER = "purpleskulltrooper85-svg";
    const REPOSITORY = "PeakGameStash";
    const BRANCH = "main";

    const GITHUB_API =
      `https://api.github.com/repos/${GITHUB_USER}/${REPOSITORY}/contents`;

    const GITHUB_PAGES =
      `https://${GITHUB_USER}.github.io/${REPOSITORY}`;

    const JSDELIVR =
      `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${REPOSITORY}@${BRANCH}`;

    /*
      CHANGE ONLY THESE FILENAMES IF YOUR THEME FILES HAVE DIFFERENT NAMES.

      Expected repository structure:

      themes/
        regular/
          click.mp3
        undertale/
          PixelOperatorMono-Bold.ttf
          audio_drone.ogg
          snd_menumove.mp3
          snd_select.mp3
        steel-ball-run/
          ... future files ...
    */
    const THEME_FILES = {
      regular: {
        click: "themes/regular/click.mp3"
      },

      undertale: {
        font: "themes/undertale/PixelOperatorMono-Bold.ttf",
        drone: "themes/undertale/audio_drone.ogg",
        move: "themes/undertale/snd_menumove.mp3",
        select: "themes/undertale/snd_select.mp3"
      }
    };

    const gamesGrid = document.getElementById("games-grid");
    const gameCount = document.getElementById("game-count");
    const searchInput = document.getElementById("search-input");
    const themeButton = document.getElementById("theme-button");
    const themeMenu = document.getElementById("theme-menu");

    const regularClickSound = new Audio();
    const undertaleDrone = new Audio();
    const undertaleMoveSound = new Audio();
    const undertaleSelectSound = new Audio();

    regularClickSound.preload = "auto";
    undertaleDrone.preload = "auto";
    undertaleMoveSound.preload = "auto";
    undertaleSelectSound.preload = "auto";

    regularClickSound.volume = 0.58;
    undertaleDrone.volume = 0.32;
    undertaleMoveSound.volume = 0.52;
    undertaleSelectSound.volume = 0.62;

    let allGames = [];
    let activeTheme = localStorage.getItem("peak-game-stash-theme") || "galaxy";
    let audioUnlocked = false;
    let lastHoveredElement = null;

    function encodePath(path) {
      return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
    }

    function cdnURL(path) {
      return `${JSDELIVR}/${encodePath(path)}`;
    }

    function pageURL(path) {
      return `${GITHUB_PAGES}/${encodePath(path)}`;
    }

    function cleanGameTitle(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/^dg/i, "")
        .replace(/^[_\-\s]*/, "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[_\-]+/g, " ")
        .replace(/\s+/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase())
        .trim() || filename;
    }

    function gameSort(a, b) {
      return a.displayName.localeCompare(b.displayName, undefined, {
        numeric: true,
        sensitivity: "base"
      });
    }

    function playSound(sound) {
      if (!sound || !sound.src) return;

      sound.pause();
      sound.currentTime = 0;

      sound.play().catch(() => {});
    }

    function unlockAudio() {
      if (audioUnlocked) return;

      audioUnlocked = true;

      if (activeTheme === "undertale") {
        startUndertaleDrone();
      }
    }

    function startUndertaleDrone() {
      if (!audioUnlocked || activeTheme !== "undertale") return;

      undertaleDrone.play().catch(() => {});
    }

    function stopUndertaleDrone() {
      undertaleDrone.pause();
      undertaleDrone.currentTime = 0;
    }

    function playHoverSound() {
      if (activeTheme === "undertale") {
        playSound(undertaleMoveSound);
      }
    }

    function playClickSound() {
      if (activeTheme === "undertale") {
        playSound(undertaleSelectSound);
      } else {
        playSound(regularClickSound);
      }
    }

    function enableHoverSound(element) {
      element.addEventListener("mouseenter", () => {
        if (lastHoveredElement === element) return;

        lastHoveredElement = element;
        playHoverSound();
      });

      element.addEventListener("mouseleave", () => {
        if (lastHoveredElement === element) {
          lastHoveredElement = null;
        }
      });

      element.addEventListener("focus", () => {
        playHoverSound();
      });
    }

    function loadThemeAssets() {
      regularClickSound.src = cdnURL(THEME_FILES.regular.click);

      undertaleDrone.src = cdnURL(THEME_FILES.undertale.drone);
      undertaleMoveSound.src = cdnURL(THEME_FILES.undertale.move);
      undertaleSelectSound.src = cdnURL(THEME_FILES.undertale.select);
    }

    function setTheme(theme) {
      activeTheme = theme;

      document.body.classList.toggle("theme-undertale", theme === "undertale");

      if (theme === "undertale") {
        themeButton.querySelector(".theme-icon").textContent = "♥";
        startUndertaleDrone();
      } else {
        themeButton.querySelector(".theme-icon").textContent = "✦";
        stopUndertaleDrone();
      }

      localStorage.setItem("peak-game-stash-theme", theme);

      themeMenu.classList.remove("open");
      themeButton.setAttribute("aria-expanded", "false");

      renderGames();
    }

    function toggleThemeMenu() {
      unlockAudio();

      const isOpen = themeMenu.classList.toggle("open");
      themeButton.setAttribute("aria-expanded", String(isOpen));

      playHoverSound();
    }

    async function fetchFolder(path) {
      const response = await fetch(
        `${GITHUB_API}/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`
      );

      if (!response.ok) {
        throw new Error(`Could not read /${path}. HTTP ${response.status}`);
      }

      return response.json();
    }

    async function getImageLookup() {
      const imageFiles = await fetchFolder("images");
      const lookup = new Map();

      imageFiles
        .filter(item => item.type === "file")
        .forEach(item => {
          const lowercaseName = item.name.toLowerCase();
          const noExtension = lowercaseName.replace(/\.[^/.]+$/, "");

          lookup.set(lowercaseName, item.path);
          lookup.set(noExtension, item.path);
        });

      return lookup;
    }

    function findImagePath(gameFileName, imageLookup) {
      const noExtension = gameFileName.replace(/\.[^/.]+$/, "");

      const candidates = [
        gameFileName,
        noExtension,
        `${noExtension}.png`,
        `${noExtension}.jpg`,
        `${noExtension}.jpeg`,
        `${noExtension}.webp`,
        `${noExtension}.gif`
      ];

      for (const candidate of candidates) {
        const found = imageLookup.get(candidate.toLowerCase());

        if (found) return found;
      }

      return null;
    }

    async function loadGames() {
      try {
        const [gameItems, imageLookup] = await Promise.all([
          fetchFolder("games"),
          getImageLookup()
        ]);

        /*
          This accepts:
          dgDeltarune.html
          dgUndertale.html
          dg_any-game.html
          dg_any-game.htm

          It also accepts dg game folders if you add any later.
        */
        allGames = gameItems
          .filter(item => {
            const startsWithDG = item.name.toLowerCase().startsWith("dg");

            const isHTMLFile =
              item.type === "file" &&
              /\.(html?|HTML?)$/.test(item.name);

            const isGameFolder = item.type === "dir";

            return startsWithDG && (isHTMLFile || isGameFolder);
          })
          .map(item => {
            const imagePath = findImagePath(item.name, imageLookup);

            return {
              id: item.name,
              path: item.path,
              type: item.type,
              displayName: cleanGameTitle(item.name),
              imagePath,

              /*
                HTML game:
                games/dgDeltarune.html
                becomes:
                https://purpleskulltrooper85-svg.github.io/PeakGameStash/games/dgDeltarune.html

                Folder game:
                games/dgExample/
                becomes:
                https://purpleskulltrooper85-svg.github.io/PeakGameStash/games/dgExample/
              */
              playURL:
                item.type === "dir"
                  ? `${pageURL(item.path)}/`
                  : pageURL(item.path)
            };
          })
          .sort(gameSort);

        renderGames();
      } catch (error) {
        console.error(error);

        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>Could not load your game stash.</strong>
            Make sure the repository is public and has
            <code>/games</code> and <code>/images</code> folders.
          </div>
        `;

        gameCount.textContent = "0 games";
      }
    }

    function createGameCard(game) {
      const card = document.createElement("article");
      card.className = "game-card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "game-image-wrap";

      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.textContent = game.displayName;

      imageWrap.appendChild(fallback);

      if (game.imagePath) {
        const image = document.createElement("img");

        image.className = "game-image";
        image.src = cdnURL(game.imagePath);
        image.alt = `${game.displayName} cover image`;

        image.addEventListener("load", () => {
          fallback.style.display = "none";
        });

        image.addEventListener("error", () => {
          image.remove();
          fallback.style.display = "grid";
        });

        imageWrap.appendChild(image);
      }

      const info = document.createElement("div");
      info.className = "game-info";

      const title = document.createElement("h4");
      title.className = "game-title";
      title.textContent = game.displayName;

      const gameID = document.createElement("p");
      gameID.className = "game-id";
      gameID.textContent = game.id;

      const playButton = document.createElement("button");
      playButton.className = "play-button";
      playButton.type = "button";
      playButton.textContent = "PLAY";

      playButton.addEventListener("click", () => {
        unlockAudio();
        playClickSound();

        setTimeout(() => {
          window.open(game.playURL, "_blank", "noopener");
        }, activeTheme === "undertale" ? 85 : 0);
      });

      enableHoverSound(card);
      enableHoverSound(playButton);

      info.append(title, gameID, playButton);
      card.append(imageWrap, info);

      return card;
    }

    function renderGames() {
      const search = searchInput.value.trim().toLowerCase();

      const filteredGames = allGames.filter(game => {
        return (
          game.displayName.toLowerCase().includes(search) ||
          game.id.toLowerCase().includes(search)
        );
      });

      gamesGrid.innerHTML = "";

      if (allGames.length === 0) {
        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>No games found yet.</strong>
            Add HTML files such as
            <code>dgDeltarune.html</code> inside <code>/games</code>.
          </div>
        `;

        gameCount.textContent = "0 games";
        return;
      }

      if (filteredGames.length === 0) {
        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>No matching games.</strong>
            Try another search.
          </div>
        `;

        gameCount.textContent = "0 matching games";
        return;
      }

      filteredGames.forEach(game => {
        gamesGrid.appendChild(createGameCard(game));
      });

      gameCount.textContent =
        `${filteredGames.length} game${filteredGames.length === 1 ? "" : "s"}`;
    }

    themeButton.addEventListener("click", () => {
      toggleThemeMenu();
    });

    enableHoverSound(themeButton);

    themeMenu.querySelectorAll("[data-theme]").forEach(button => {
      button.addEventListener("click", () => {
        unlockAudio();
        playClickSound();
        setTheme(button.dataset.theme);
      });

      enableHoverSound(button);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".theme-wrap")) {
        themeMenu.classList.remove("open");
        themeButton.setAttribute("aria-expanded", "false");
      }
    });

    searchInput.addEventListener("input", renderGames);

    searchInput.addEventListener("focus", () => {
      unlockAudio();
      playHoverSound();
    });

    document.addEventListener("pointerdown", unlockAudio, {
      once: true
    });

    document.addEventListener("keydown", event => {
      unlockAudio();

      if (event.key === "Escape") {
        themeMenu.classList.remove("open");
        themeButton.setAttribute("aria-expanded", "false");
      }

      if (event.key === "/" && document.activeElement !== searchInput) {
        event.preventDefault();
        searchInput.focus();
      }
    });

    loadThemeAssets();
    setTheme(activeTheme);
    loadGames();
  </script>
</body>
</html>
