<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peak Game Stash</title>

  <style>
    @font-face {
      font-family: "Peak Pixel";
      src: url("https://cdn.jsdelivr.net/gh/purpleskulltrooper85-svg/PeakGameStash@main/themes/undertale/PixelOperatorMono-Bold.ttf?v=1")
        format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-one: #08051e;
      --bg-two: #1a0c49;
      --bg-three: #36136b;
      --text: #f7f5ff;
      --muted: #beb5e4;
      --card: rgba(15, 12, 47, 0.70);
      --card-hover: rgba(49, 29, 112, 0.86);
      --line: rgba(197, 181, 255, 0.28);
      --accent: #bd9cff;
      --accent-two: #5edaff;
      --button-text: #160a32;
      --font-main: Arial, system-ui, sans-serif;
      --font-title: Arial, system-ui, sans-serif;
      --sbr-background: none;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #08051e;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: var(--font-main);
      background:
        radial-gradient(circle at 13% 17%, rgba(129, 85, 255, 0.29), transparent 26%),
        radial-gradient(circle at 85% 18%, rgba(62, 206, 255, 0.22), transparent 24%),
        radial-gradient(circle at 48% 89%, rgba(236, 72, 255, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg-one), var(--bg-two), var(--bg-three));
      background-size: 150% 150%;
      background-attachment: fixed;
      animation: galaxy-shift 18s ease-in-out infinite alternate;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
    }

    body::before {
      opacity: 0.72;
      background-image:
        radial-gradient(circle at 7% 17%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 18% 76%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 31% 39%, #fff 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 45% 13%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 58% 71%, #fff 0 1px, transparent 1.7px),
        radial-gradient(circle at 73% 29%, #fff 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 89% 61%, #fff 0 1px, transparent 1.7px);
      background-size: 340px 280px;
      animation: stars-drift 26s linear infinite;
    }

    body::after {
      opacity: 0.18;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 80px,
          rgba(255, 255, 255, 0.1) 81px,
          transparent 82px
        );
      mix-blend-mode: screen;
    }

    @keyframes galaxy-shift {
      from {
        background-position: 0% 35%;
      }

      to {
        background-position: 100% 65%;
      }
    }

    @keyframes stars-drift {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-70px, 45px, 0);
      }
    }

    body.theme-undertale {
      --bg-one: #000;
      --bg-two: #000;
      --bg-three: #000;
      --text: #fff;
      --muted: #aaa;
      --card: #000;
      --card-hover: #111;
      --line: #444;
      --accent: #ffff00;
      --accent-two: #ffff00;
      --button-text: #000;
      --font-main: "Peak Pixel", "Courier New", monospace;
      --font-title: "Peak Pixel", "Courier New", monospace;
      background: #000;
      animation: none;
      image-rendering: pixelated;
    }

    body.theme-undertale::before,
    body.theme-undertale::after {
      display: none;
    }

    body.theme-sbr {
      --text: #fff6d8;
      --muted: #e7c98b;
      --card: rgba(30, 14, 7, 0.80);
      --card-hover: rgba(86, 44, 12, 0.88);
      --line: rgba(255, 207, 97, 0.48);
      --accent: #ffd35b;
      --accent-two: #da6a20;
      --button-text: #281102;
      --font-main: Georgia, "Times New Roman", serif;
      --font-title: Georgia, "Times New Roman", serif;
      background-color: #1a0903;
      background-image:
        linear-gradient(rgba(18, 6, 2, 0.56), rgba(18, 6, 2, 0.72)),
        var(--sbr-background);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      animation: none;
    }

    body.theme-sbr::before {
      opacity: 0.17;
      background:
        repeating-linear-gradient(
          -18deg,
          transparent 0,
          transparent 40px,
          rgba(255, 216, 116, 0.20) 41px,
          transparent 43px
        );
      animation: none;
    }

    body.theme-sbr::after {
      display: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .site-shell {
      width: min(1500px, calc(100% - 44px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border: 2px solid var(--accent);
      border-radius: 17px;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.28);
      font-size: 28px;
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-family: var(--font-title);
      font-size: clamp(22px, 2.7vw, 40px);
      line-height: 1.1;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .theme-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    #theme-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(10, 7, 32, 0.50);
      color: var(--text);
      cursor: pointer;
    }

    #theme-button:hover,
    #theme-button:focus-visible {
      border-color: var(--accent);
      background: var(--card-hover);
      outline: none;
    }

    .theme-icon {
      font-size: 22px;
      line-height: 1;
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 20;
      width: min(315px, calc(100vw - 30px));
      display: none;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(12, 8, 35, 0.97);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
    }

    body.theme-undertale .theme-menu {
      border-radius: 0;
      background: #000;
      backdrop-filter: none;
    }

    body.theme-sbr .theme-menu {
      background: rgba(33, 12, 3, 0.96);
    }

    .theme-menu.open {
      display: block;
    }

    .theme-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    body.theme-undertale .theme-option {
      border-radius: 0;
    }

    .theme-option:hover,
    .theme-option:focus-visible {
      background: rgba(185, 156, 255, 0.18);
      outline: none;
    }

    body.theme-undertale .theme-option:hover,
    body.theme-undertale .theme-option:focus-visible {
      background: #191919;
      color: #ffff00;
    }

    body.theme-sbr .theme-option:hover,
    body.theme-sbr .theme-option:focus-visible {
      background: rgba(255, 192, 73, 0.15);
    }

    .theme-option.disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .theme-preview {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 10px;
    }

    .theme-preview.galaxy {
      background: linear-gradient(135deg, #0f0b36, #743ca3, #48c9f5);
    }

    .theme-preview.undertale {
      border-color: #fff;
      background: #000;
      box-shadow: inset 0 0 0 3px #ffff00;
    }

    .theme-preview.sbr {
      background: linear-gradient(135deg, #4d1d09, #d9a52c, #2f5d20);
    }

    .theme-preview.future {
      background:
        repeating-linear-gradient(
          45deg,
          #333 0 8px,
          #111 8px 16px
        );
    }

    .theme-option strong {
      display: block;
      font-size: 17px;
    }

    .theme-option small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .hero {
      max-width: 920px;
      margin: 0 auto 38px;
      text-align: center;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(30px, 5vw, 62px);
      line-height: 1.05;
    }

    .hero h2 span {
      color: var(--accent);
      text-shadow: 0 0 23px rgba(185, 156, 255, 0.55);
    }

    .hero p {
      max-width: 620px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.45;
    }

    .search-area {
      position: relative;
      max-width: 900px;
      margin: 28px auto 0;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 21px;
      color: var(--muted);
      font-size: 22px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    #search-input {
      width: 100%;
      height: 64px;
      padding: 0 20px 0 58px;
      border: 1px solid var(--line);
      border-radius: 18px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 20px;
    }

    #search-input::placeholder {
      color: var(--muted);
    }

    #search-input:focus {
      border-color: var(--accent);
      background: var(--card-hover);
      box-shadow: 0 0 0 4px rgba(185, 156, 255, 0.16);
    }

    body.theme-undertale #search-input,
    body.theme-undertale #theme-button {
      border-radius: 0;
    }

    body.theme-undertale #search-input:focus {
      box-shadow: 0 0 0 3px #ffff00;
    }

    .games-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 48px 0 20px;
    }

    .games-heading h3 {
      margin: 0;
      font-size: clamp(25px, 3vw, 38px);
    }

    #game-count {
      color: var(--muted);
      font-size: 17px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 22px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--card);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    body.theme-undertale .game-card {
      border-radius: 0;
      box-shadow: none;
    }

    .game-card:hover {
      border-color: var(--accent);
      background: var(--card-hover);
      transform: translateY(-7px);
    }

    .game-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(185, 156, 255, 0.28), rgba(50, 203, 255, 0.2)),
        #15102f;
    }

    body.theme-sbr .game-image-wrap {
      background:
        linear-gradient(135deg, rgba(255, 204, 89, 0.22), rgba(111, 39, 6, 0.5)),
        #2e0d04;
    }

    .game-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .game-card:hover .game-image {
      transform: scale(1.06);
    }

    body.theme-undertale .game-image {
      image-rendering: pixelated;
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.2), transparent 32%),
        linear-gradient(135deg, #302164, #15102f);
      font-family: var(--font-title);
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }

    body.theme-undertale .image-fallback {
      color: #ffff00;
      background: #000;
      border: 3px solid #fff;
    }

    body.theme-sbr .image-fallback {
      background: linear-gradient(135deg, #612308, #1f0903);
    }

    .game-info {
      padding: 17px;
    }

    .game-title {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 23px;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play-button {
      width: 100%;
      min-height: 42px;
      margin-top: 15px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-two));
      color: var(--button-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.6px;
    }

    body.theme-undertale .play-button {
      border-radius: 0;
      background: #ffff00;
      color: #000;
      font-family: "Peak Pixel", "Courier New", monospace;
    }

    .play-button:hover,
    .play-button:focus-visible {
      outline: none;
      filter: brightness(1.15);
      transform: scale(1.025);
    }

    .state-box {
      grid-column: 1 / -1;
      padding: 48px 22px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      background: rgba(0, 0, 0, 0.16);
    }

    body.theme-undertale .state-box {
      border-radius: 0;
      background: #000;
    }

    .state-box strong {
      display: block;
      margin-bottom: 9px;
      color: var(--text);
      font-size: 24px;
    }

    .state-box code {
      color: var(--accent);
      font-family: "Courier New", monospace;
    }

    .site-footer {
      margin-top: 52px;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
    }

    .site-footer span {
      color: var(--accent);
    }

    #game-player {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #000;
    }

    #game-player.open {
      display: block;
    }

    #game-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    #game-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #000;
      pointer-events: none;
    }

    #loading-border {
      width: min(520px, 74vw);
      height: 34px;
      padding: 4px;
      border: 4px solid #fff;
      background: #000;
    }

    #loading-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 150ms linear;
    }

    #back-button {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 5;
      display: none;
      padding: 9px 13px;
      border: 2px solid #fff;
      background: #000;
      color: #fff;
      cursor: pointer;
      font-family: "Peak Pixel", "Courier New", monospace;
      font-weight: 700;
      font-size: 17px;
    }

    #back-button:hover,
    #back-button:focus-visible {
      border-color: #ffff00;
      color: #ffff00;
      outline: none;
    }

    @media (max-width: 680px) {
      .site-shell {
        width: min(100% - 24px, 1500px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        margin-bottom: 32px;
      }

      .brand {
        gap: 10px;
      }

      .brand-mark {
        width: 45px;
        height: 45px;
        border-radius: 14px;
        font-size: 23px;
      }

      .brand p {
        display: none;
      }

      #theme-button {
        min-height: 43px;
        padding: 9px 12px;
      }

      .theme-button-label {
        display: none;
      }

      .games-heading {
        margin-top: 34px;
      }

      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .game-info {
        padding: 12px;
      }

      .game-title {
        font-size: 18px;
      }

      .play-button {
        min-height: 37px;
        margin-top: 11px;
        font-size: 14px;
      }
    }

    @media (max-width: 390px) {
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="site-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">▲</div>

        <div>
          <h1>Peak Game Stash</h1>
          <p>Your personal browser-game collection.</p>
        </div>
      </div>

      <div class="theme-wrap">
        <button id="theme-button" type="button" aria-expanded="false">
          <span class="theme-icon" aria-hidden="true">✦</span>
          <span class="theme-button-label">Themes</span>
          <span aria-hidden="true">▾</span>
        </button>

        <div id="theme-menu" class="theme-menu" role="menu">
          <button class="theme-option" type="button" data-theme="galaxy">
            <span class="theme-preview galaxy"></span>
            <span>
              <strong>Galaxy</strong>
              <small>Animated cosmic gradient</small>
            </span>
          </button>

          <button class="theme-option" type="button" data-theme="undertale">
            <span class="theme-preview undertale"></span>
            <span>
              <strong>Undertale &amp; Deltarune</strong>
              <small>Black pixel-style theme</small>
            </span>
          </button>

          <button class="theme-option" type="button" data-theme="sbr">
            <span class="theme-preview sbr"></span>
            <span>
              <strong>Steel Ball Run</strong>
              <small>Desert racing theme</small>
            </span>
          </button>

          <button class="theme-option disabled" type="button" disabled>
            <span class="theme-preview future"></span>
            <span>
              <strong>Theme Slot</strong>
              <small>Coming later</small>
            </span>
          </button>
        </div>
      </div>
    </header>

    <section class="hero">
      <h2>Find your next <span>peak</span> game.</h2>

      <p>Search your game collection and play directly in your browser.</p>

      <div class="search-area">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="search-input"
          type="search"
          autocomplete="off"
          placeholder="Search your game stash..."
          aria-label="Search games"
        />
      </div>
    </section>

    <section>
      <div class="games-heading">
        <h3>Games</h3>
        <span id="game-count">Loading games...</span>
      </div>

      <div id="games-grid" class="games-grid">
        <div class="state-box">
          <strong>Loading game stash...</strong>
          Reading your <code>/games</code> folder.
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>Peak Game Stash</span> · Your game collection
    </footer>
  </main>

  <section id="game-player">
    <button id="back-button" type="button">← BACK TO STASH</button>

    <div id="game-loading">
      <div id="loading-border">
        <div id="loading-fill"></div>
      </div>
    </div>

    <iframe
      id="game-frame"
      title="Peak Game Stash Game Player"
      allow="autoplay; fullscreen; gamepad"
    ></iframe>
  </section>

  <script>
    const USER = "purpleskulltrooper85-svg";
    const REPO = "PeakGameStash";
    const BRANCH = "main";

    const CDN = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}`;
    const GITHUB_API =
      `https://api.github.com/repos/${USER}/${REPO}/contents`;

    const THEME_ASSETS = {
      regularClick: [
        "themes/regular/ClickSound.mp3",
        "themes/regular/clicksound.mp3",
        "themes/regular/click.mp3",
        "themes/regular/Click.mp3"
      ],

      regularMusic: [
        "themes/regular/music.mp3",
        "themes/regular/music.ogg",
        "themes/regular/Music.mp3",
        "themes/regular/Music.ogg"
      ],

      undertaleDrone: [
        "themes/undertale/audio_drone.ogg",
        "themes/undertale/AudioDrone.ogg",
        "themes/undertale/drone.ogg"
      ],

      undertaleMove: [
        "themes/undertale/snd_menumove.mp3",
        "themes/undertale/menuMove.mp3",
        "themes/undertale/menumove.mp3"
      ],

      undertaleSelect: [
        "themes/undertale/snd_select.mp3",
        "themes/undertale/select.mp3",
        "themes/undertale/menuSelect.mp3"
      ],

      undertaleMusic: [
        "themes/undertale/music.mp3",
        "themes/undertale/music.ogg",
        "themes/undertale/Music.mp3",
        "themes/undertale/Music.ogg"
      ],

      sbrBackground: [
        "themes/steelballrun/background.png",
        "themes/steelballrun/Background.png",
        "themes/steelballrun/background.jpg",
        "themes/steelballrun/Background.jpg",
        "themes/steelballrun/background.jpeg",
        "themes/steelballrun/Background.jpeg",
        "themes/steelballrun/background.webp",
        "themes/steelballrun/Background.webp"
      ]
    };

    const gamesGrid = document.getElementById("games-grid");
    const gameCount = document.getElementById("game-count");
    const searchInput = document.getElementById("search-input");
    const themeButton = document.getElementById("theme-button");
    const themeMenu = document.getElementById("theme-menu");

    const gamePlayer = document.getElementById("game-player");
    const gameFrame = document.getElementById("game-frame");
    const gameLoading = document.getElementById("game-loading");
    const loadingFill = document.getElementById("loading-fill");
    const backButton = document.getElementById("back-button");

    const regularClick = new Audio();
    const regularMusic = new Audio();

    const undertaleDrone = new Audio();
    const undertaleMove = new Audio();
    const undertaleSelect = new Audio();
    const undertaleMusic = new Audio();

    regularClick.preload = "auto";
    regularMusic.preload = "auto";

    undertaleDrone.preload = "auto";
    undertaleMove.preload = "auto";
    undertaleSelect.preload = "auto";
    undertaleMusic.preload = "auto";

    regularClick.volume = 0.58;
    regularMusic.volume = 0.30;

    undertaleDrone.volume = 0.24;
    undertaleMove.volume = 0.52;
    undertaleSelect.volume = 0.62;
    undertaleMusic.volume = 0.30;

    regularMusic.loop = true;
    undertaleDrone.loop = true;
    undertaleMusic.loop = true;

    let activeTheme = localStorage.getItem("peak-theme") || "galaxy";
    let games = [];
    let imageFiles = [];
    let audioUnlocked = false;
    let lastHoveredElement = null;
    let loadingProgress = 0;
    let loadingTimer = null;

    function encodePath(path) {
      return path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
    }

    function cdn(path) {
      return `${CDN}/${encodePath(path)}?v=2`;
    }

    function gameURL(path) {
      return cdn(path);
    }

    function cleanGameName(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/^dg/i, "")
        .replace(/^[_\-\s]*/, "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[_\-]+/g, " ")
        .replace(/\s+/g, " ")
        .replace(/\b\w/g, character => character.toUpperCase())
        .trim() || "Unnamed Game";
    }

    function playSound(sound) {
      if (!sound.src) return;

      sound.pause();
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function stopAllThemeMusic() {
      regularMusic.pause();
      regularMusic.currentTime = 0;

      undertaleMusic.pause();
      undertaleMusic.currentTime = 0;

      undertaleDrone.pause();
      undertaleDrone.currentTime = 0;
    }

    function startThemeMusic() {
      if (!audioUnlocked || gamePlayer.classList.contains("open")) return;

      stopAllThemeMusic();

      if (activeTheme === "galaxy") {
        regularMusic.play().catch(() => {});
      }

      if (activeTheme === "undertale") {
        undertaleMusic.play().catch(() => {});
        undertaleDrone.play().catch(() => {});
      }
    }

    function unlockAudio() {
      if (audioUnlocked) return;

      audioUnlocked = true;
      startThemeMusic();
    }

    function playHoverSound() {
      if (activeTheme === "undertale") {
        playSound(undertaleMove);
      }
    }

    function playGameSound() {
      if (activeTheme === "undertale") {
        playSound(undertaleSelect);
      } else if (activeTheme === "galaxy") {
        playSound(regularClick);
      }
    }

    function enableHoverSound(element) {
      element.addEventListener("mouseenter", () => {
        if (lastHoveredElement === element) return;

        lastHoveredElement = element;
        playHoverSound();
      });

      element.addEventListener("mouseleave", () => {
        if (lastHoveredElement === element) {
          lastHoveredElement = null;
        }
      });

      element.addEventListener("focus", playHoverSound);
    }

    async function pathExists(path) {
      try {
        const response = await fetch(cdn(path), {
          method: "HEAD",
          cache: "no-store"
        });

        return response.ok;
      } catch {
        return false;
      }
    }

    async function firstExistingPath(paths) {
      for (const path of paths) {
        if (await pathExists(path)) {
          return path;
        }
      }

      return null;
    }

    async function loadThemeAssets() {
      const [
        regularClickPath,
        regularMusicPath,
        dronePath,
        movePath,
        selectPath,
        undertaleMusicPath,
        sbrPath
      ] = await Promise.all([
        firstExistingPath(THEME_ASSETS.regularClick),
        firstExistingPath(THEME_ASSETS.regularMusic),
        firstExistingPath(THEME_ASSETS.undertaleDrone),
        firstExistingPath(THEME_ASSETS.undertaleMove),
        firstExistingPath(THEME_ASSETS.undertaleSelect),
        firstExistingPath(THEME_ASSETS.undertaleMusic),
        firstExistingPath(THEME_ASSETS.sbrBackground)
      ]);

      if (regularClickPath) regularClick.src = cdn(regularClickPath);
      if (regularMusicPath) regularMusic.src = cdn(regularMusicPath);

      if (dronePath) undertaleDrone.src = cdn(dronePath);
      if (movePath) undertaleMove.src = cdn(movePath);
      if (selectPath) undertaleSelect.src = cdn(selectPath);
      if (undertaleMusicPath) undertaleMusic.src = cdn(undertaleMusicPath);

      if (sbrPath) {
        document.documentElement.style.setProperty(
          "--sbr-background",
          `url("${cdn(sbrPath)}")`
        );
      }

      if (audioUnlocked) {
        startThemeMusic();
      }
    }

    function setTheme(theme) {
      activeTheme = theme;

      document.body.classList.toggle("theme-undertale", theme === "undertale");
      document.body.classList.toggle("theme-sbr", theme === "sbr");

      const icon = themeButton.querySelector(".theme-icon");

      if (theme === "undertale") {
        icon.textContent = "♥";
      } else if (theme === "sbr") {
        icon.textContent = "★";
      } else {
        icon.textContent = "✦";
      }

      localStorage.setItem("peak-theme", theme);

      themeMenu.classList.remove("open");
      themeButton.setAttribute("aria-expanded", "false");

      if (audioUnlocked) {
        startThemeMusic();
      }

      renderGames();
    }

    function toggleThemeMenu() {
      unlockAudio();

      const open = themeMenu.classList.toggle("open");
      themeButton.setAttribute("aria-expanded", String(open));

      playHoverSound();
    }

    async function githubFolder(path) {
      const response = await fetch(
        `${GITHUB_API}/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(`Could not load /${path}: HTTP ${response.status}`);
      }

      return response.json();
    }

    function imageForGame(gameFileName) {
      const noExtension = gameFileName.replace(/\.[^/.]+$/, "");

      const candidateNames = [
        `${noExtension}.png`,
        `${noExtension}.jpg`,
        `${noExtension}.jpeg`,
        `${noExtension}.webp`,
        `${noExtension}.gif`,
        `${gameFileName}.png`,
        `${gameFileName}.jpg`,
        `${gameFileName}.webp`
      ];

      const found = imageFiles.find(image => {
        return candidateNames.includes(image.name);
      });

      return found ? found.path : null;
    }

    async function loadGames() {
      try {
        const [gameItems, imageItems] = await Promise.all([
          githubFolder("games"),
          githubFolder("images")
        ]);

        imageFiles = imageItems.filter(item => item.type === "file");

        games = gameItems
          .filter(item => {
            return (
              item.type === "file" &&
              /^dg/i.test(item.name) &&
              /\.html?$/i.test(item.name)
            );
          })
          .map(item => {
            return {
              filename: item.name,
              path: item.path,
              title: cleanGameName(item.name),
              imagePath: imageForGame(item.name)
            };
          })
          .sort((a, b) => {
            return a.title.localeCompare(b.title, undefined, {
              numeric: true,
              sensitivity: "base"
            });
          });

        renderGames();
      } catch (error) {
        console.error(error);

        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>Could not load games.</strong>
            Put files such as <code>dgDeltarune.html</code>
            directly inside <code>/games</code>.
          </div>
        `;

        gameCount.textContent = "0 games";
      }
    }

    function setProgress(value) {
      loadingProgress = Math.max(0, Math.min(100, value));
      loadingFill.style.width = `${loadingProgress}%`;
    }

    function startLoadingBar() {
      clearInterval(loadingTimer);
      setProgress(0);

      loadingTimer = setInterval(() => {
        if (loadingProgress < 88) {
          const amount = loadingProgress < 45 ? 5 : 1.8;
          setProgress(loadingProgress + amount);
        }
      }, 120);
    }

    function finishLoadingBar() {
      clearInterval(loadingTimer);
      setProgress(100);

      setTimeout(() => {
        gameLoading.style.display = "none";
      }, 180);
    }

    function resetLoadingBar() {
      clearInterval(loadingTimer);
      setProgress(0);
      gameLoading.style.display = "grid";
    }

    function launchGame(game) {
      unlockAudio();
      playGameSound();
      stopAllThemeMusic();

      gamePlayer.classList.add("open");
      backButton.style.display = "block";

      resetLoadingBar();
      startLoadingBar();

      gameFrame.src = gameURL(game.path);
    }

    function returnToStash() {
      if (activeTheme === "undertale") {
        playSound(undertaleSelect);
      }

      gameFrame.src = "about:blank";

      gamePlayer.classList.remove("open");
      backButton.style.display = "none";

      resetLoadingBar();
      startThemeMusic();
    }

    gameFrame.addEventListener("load", () => {
      finishLoadingBar();
    });

    function createGameCard(game) {
      const card = document.createElement("article");
      card.className = "game-card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "game-image-wrap";

      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.textContent = game.title;

      imageWrap.appendChild(fallback);

      if (game.imagePath) {
        const image = document.createElement("img");

        image.className = "game-image";
        image.src = cdn(game.imagePath);
        image.alt = `${game.title} cover`;

        image.addEventListener("load", () => {
          fallback.style.display = "none";
        });

        image.addEventListener("error", () => {
          image.remove();
          fallback.style.display = "grid";
        });

        imageWrap.appendChild(image);
      }

      const info = document.createElement("div");
      info.className = "game-info";

      const title = document.createElement("h4");
      title.className = "game-title";
      title.textContent = game.title;

      const playButton = document.createElement("button");
      playButton.className = "play-button";
      playButton.type = "button";
      playButton.textContent = "PLAY";

      playButton.addEventListener("click", () => {
        launchGame(game);
      });

      enableHoverSound(card);
      enableHoverSound(playButton);

      info.append(title, playButton);
      card.append(imageWrap, info);

      return card;
    }

    function renderGames() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = games.filter(game => {
        return game.title.toLowerCase().includes(query);
      });

      gamesGrid.innerHTML = "";

      if (games.length === 0) {
        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>No games found.</strong>
            Add files like <code>games/dgDeltarune.html</code>.
          </div>
        `;

        gameCount.textContent = "0 games";
        return;
      }

      if (filtered.length === 0) {
        gamesGrid.innerHTML = `
          <div class="state-box">
            <strong>No matching games.</strong>
            Try another search.
          </div>
        `;

        gameCount.textContent = "0 matching games";
        return;
      }

      filtered.forEach(game => {
        gamesGrid.appendChild(createGameCard(game));
      });

      gameCount.textContent =
        `${filtered.length} game${filtered.length === 1 ? "" : "s"}`;
    }

    themeButton.addEventListener("click", toggleThemeMenu);
    enableHoverSound(themeButton);

    themeMenu.querySelectorAll("[data-theme]").forEach(button => {
      button.addEventListener("click", () => {
        unlockAudio();

        if (activeTheme === "undertale") {
          playSound(undertaleSelect);
        }

        setTheme(button.dataset.theme);
      });

      enableHoverSound(button);
    });

    backButton.addEventListener("click", returnToStash);

    document.addEventListener("click", event => {
      if (!event.target.closest(".theme-wrap")) {
        themeMenu.classList.remove("open");
        themeButton.setAttribute("aria-expanded", "false");
      }
    });

    searchInput.addEventListener("input", renderGames);

    searchInput.addEventListener("focus", () => {
      unlockAudio();
      playHoverSound();
    });

    document.addEventListener("pointerdown", unlockAudio, {
      once: true
    });

    document.addEventListener("keydown", event => {
      unlockAudio();

      if (gamePlayer.classList.contains("open")) {
        if (event.key === "Escape") {
          returnToStash();
        }

        return;
      }

      if (event.key === "Escape") {
        themeMenu.classList.remove("open");
        themeButton.setAttribute("aria-expanded", "false");
      }

      if (event.key === "/" && document.activeElement !== searchInput) {
        event.preventDefault();
        searchInput.focus();
      }
    });

    loadThemeAssets();
    setTheme(activeTheme);
    loadGames();
  </script>
</body>
</html>
